name: Build & Release Kofu Mobile

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
      - '2.1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Ensure CMake and SDK tools
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;26.1.10909125" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x Kofu_Assistant/gradlew

      - name: Build Android APKs (Release & Debug)
        run: |
          cd Kofu_Assistant
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p build-artifacts
          
          # Copiar APK Release (firmado con debug keystore para instalación directa)
          if [ -f Kofu_Assistant/app/build/outputs/apk/release/app-release.apk ]; then
            cp Kofu_Assistant/app/build/outputs/apk/release/app-release.apk build-artifacts/Kofu_Assistant-v2.1.0-arm64-v8a-release.apk
          elif [ -f Kofu_Assistant/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp Kofu_Assistant/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/Kofu_Assistant-v2.1.0-arm64-v8a-release.apk
          fi

          # Copiar APK Debug oficial
          if [ -f Kofu_Assistant/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp Kofu_Assistant/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Kofu_Assistant-v2.1.0-arm64-v8a-debug.apk
            cp Kofu_Assistant/app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
          fi

          # Generar sumas de verificación SHA-256
          cd build-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: kofu-mobile-apks
          path: build-artifacts/*
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Kofu Mobile ${{ github.ref_name }} [Estable]"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
