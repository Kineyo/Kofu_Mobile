name: Build & Release Aura (Branch kofu-go)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Aura (7nm Legacy ARMv8-a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Configure Android SDK and Permissions
        run: |
          mkdir -p /home/runner/.android /home/runner/.config/.android
          sudo chown -R runner:runner /home/runner "$ANDROID_SDK_ROOT" || true
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "ndk;26.1.10909125" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x Kofu_Assistant/gradlew

      - name: Run Unit Tests & 500-Question RAG Stress Suite (7nm)
        run: |
          cd Kofu_Assistant
          ./gradlew testNode7nmDebugUnitTest --no-daemon --stacktrace

      - name: Build Aura 7nm Legacy APKs
        run: |
          cd Kofu_Assistant
          ./gradlew \
            assembleNode7nmRelease \
            assembleNode7nmDebug \
            --no-daemon --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p build-artifacts
          VERSION_TAG="${GITHUB_REF_NAME:-kofu-go}"

          APK_7NM="Kofu_Assistant/app/build/outputs/apk/node7nm/release/app-node7nm-release.apk"
          if [ -f "$APK_7NM" ]; then
            cp "$APK_7NM" "build-artifacts/Aura-${VERSION_TAG}-7nm-arm64-v8a-release.apk"
            cp "$APK_7NM" "build-artifacts/app-release.apk"
          fi

          APK_7NM_DBG="Kofu_Assistant/app/build/outputs/apk/node7nm/debug/app-node7nm-debug.apk"
          if [ -f "$APK_7NM_DBG" ]; then
            cp "$APK_7NM_DBG" "build-artifacts/Aura-${VERSION_TAG}-7nm-arm64-v8a-debug.apk"
          fi

          cd build-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: aura-kofu-go-7nm-apks
          path: build-artifacts/*
          retention-days: 14
